version: 2

project_name: migrail

before:
  hooks:
    - go mod download

builds:
  - &build
    id: darwin-arm64
    main: ./cmd/migrail
    binary: migrail
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - '{{ if eq .Os "linux" }}-linkmode external -extldflags=-static{{ end }}'
      - -X github.com/bbrainttech/migrail/internal/cli.version={{ .Version }}
      - -X github.com/bbrainttech/migrail/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/bbrainttech/migrail/internal/cli.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - <<: *build
    id: darwin-amd64
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++

  - <<: *build
    id: linux-amd64
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-musl
      - CXX=zig c++ -target x86_64-linux-musl

  - <<: *build
    id: linux-arm64
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-musl
      - CXX=zig c++ -target aarch64-linux-musl

  - <<: *build
    id: windows-amd64
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-windows-gnu
      - CXX=zig c++ -target x86_64-windows-gnu

  - <<: *build
    id: windows-arm64
    goos: [windows]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-windows-gnu
      - CXX=zig c++ -target aarch64-windows-gnu

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^build:"
      - "^tools:"

release:
  github:
    owner: bbrainttech
    name: migrail
  draft: true
  prerelease: auto
  extra_files:
    - glob: ./install.sh

homebrew_casks:
  - name: migrail
    binaries: [migrail]
    homepage: https://github.com/bbrainttech/migrail
    description: Catch dangerous database migrations before they reach production
    license: Apache-2.0
    repository:
      owner: bbrainttech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    commit_author:
      name: migrail-release
      email: noreply@github.com
    commit_msg_template: "migrail {{ .Tag }}"
    skip_upload: auto
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/migrail"]
          end
